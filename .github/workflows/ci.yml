name: CI

# Covers the same ground as `make check`. The editor (TypeScript) and Swift
# halves are separate jobs so a failure in one never hides the other.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  # Lets the Release workflow gate publishing on these checks.
  workflow_call:

permissions:
  contents: read

# Keep this group distinct from Release when CI is called as a reusable workflow.
# Supersede stale runs on a PR; never cancel runs on master.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  editor:
    name: Editor (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm run audit

      - name: Test release scripts
        run: make test-release
        working-directory: .

  swift:
    name: Swift (tests + app build)
    # Package.swift targets macOS 26. macOS minutes are billed at 10x on
    # private repositories, hence the tight timeout.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Toolchain versions
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          node --version

      - name: Install editor dependencies
        run: npm ci
        working-directory: editor

      # The app embeds the bundled editor as a SwiftPM resource, so it must
      # be built before the app can be.
      - name: Build editor bundle
        run: npm run build
        working-directory: editor

      # Tests live in the JotTestRunner executable rather than a test target,
      # so `swift test` would run nothing (see the Makefile).
      - name: Run Swift tests
        run: make test-swift

      - name: Build and verify Apple Silicon download
        run: make dist

      - name: Upload release downloads
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: jot-macos-arm64
          path: |
            build/release/Jot-macos-arm64.zip
            build/release/checksums.txt
          if-no-files-found: error
          retention-days: 7
