name: Release

# Publishes a source release when a SemVer tag (for example v0.1.0-alpha.1)
# is pushed. Create tags with `make release VERSION=...`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag against SemVer and Info.plist
        run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Source-only: GitHub attaches the source archives. Tags with a
      # pre-release suffix (-alpha, -beta, -rc) are marked as pre-releases.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Jot $TAG" \
            --notes-file .github/release-notes.md --generate-notes "${flags[@]}"
